name: Graphify Architecture Map

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'graphify-out/**'
      - '**/*.md'

jobs:
  graphify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphify
        run: |
          python -m pip install --upgrade pip
          python -m pip install graphifyy
          graphify --version

      - name: Build local code knowledge graph
        run: |
          graphify extract . --code-only --timing
          test -f graphify-out/graph.json

      - name: Export call-flow visualization
        run: |
          graphify export callflow-html || true

      - name: Show generated files
        run: |
          find graphify-out -maxdepth 2 -type f -print | sort

      - name: Upload Graphify architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: soloforge-graphify-architecture
          path: graphify-out/
          if-no-files-found: error
          retention-days: 14

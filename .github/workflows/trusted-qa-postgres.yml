name: Trusted QA PostgreSQL Concurrency (Disposable)
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/202610160001_qa_trusted_evidence_preparation.sql'
      - 'backend/asset_forge/tests/test_trusted_qa_postgres.py'
      - 'supabase/migrations/202610160002_qa_atomic_chain_claim_preparation.sql'
      - '.github/workflows/trusted-qa-postgres.yml'
      - 'supabase/migrations/202610160003_qa_verification_receipt_preparation.sql'
      - 'backend/asset_forge/tests/qa_receipt_cases.py'
  workflow_dispatch:
jobs:
  trusted-qa-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: trusted_qa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trusted_qa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QA_TEST_DSN: postgresql://postgres:ci-only-password@localhost:5432/trusted_qa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated PostgreSQL test dependency
        run: python -m pip install 'psycopg[binary]>=3.2,<4' pytest
      - name: Run schema, authorization and multi-connection race tests
        run: python -m pytest -q backend/asset_forge/tests/test_trusted_qa_postgres.py

name: Build SoloForge Android APK

on:
  push:
    branches:
      - main
      - feature/asset-forge-mvp
    paths:
      - 'frontend/**'
      - '.github/workflows/flutter-android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Regenerate launcher icons
        working-directory: frontend
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        working-directory: frontend
        run: flutter analyze

      - name: Compute APK version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if (( GITHUB_RUN_ATTEMPT >= 100 )); then
            echo 'Run attempt exceeds reserved build-number range' >&2
            exit 1
          fi
          echo "build_number=$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: frontend
        run: >-
          flutter build apk --release
          --build-name=0.1.2
          --build-number=${{ steps.version.outputs.build_number }}
          --dart-define=SOLOFORGE_APP_VERSION=0.1.2
          --dart-define=SOLOFORGE_BUILD_NUMBER=${{ steps.version.outputs.build_number }}
          --dart-define=SOLOFORGE_COMMIT_SHA=${{ github.sha }}
          --dart-define=ASSET_FORGE_API_URL=https://soloforge-asset-forge.onrender.com
          --dart-define=SOLOFORGE_OWNER_V2=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: soloforge-asset-forge-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

name: Owner Binding Disposable PostgreSQL Integration

# Manual-only: no production services, provider credentials or deploys.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_owner
          POSTGRES_PASSWORD: disposable_only
          POSTGRES_DB: owner_binding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_owner -d owner_binding_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOLOFORGE_DISPOSABLE_PG_TEST: '1'
      SOLOFORGE_DISPOSABLE_PG_DSN: 'host=127.0.0.1 port=5432 dbname=owner_binding_test user=test_owner password=disposable_only'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: test_owner
      PGPASSWORD: disposable_only
      PGDATABASE: owner_binding_test
      SOLOFORGE_RUN_EMBEDDED_WORKERS: 'false'
      SOLOFORGE_ENABLE_GENERATION: 'false'
      SOLOFORGE_ENABLE_PUBLISHING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test requirements
        run: python -m pip install 'psycopg[binary]>=3.2,<4' 'pytest>=8,<10'
      - name: Apply only the inert owner-binding schema to disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610210001_owner_provider_binding_foundation.sql
      - name: Run real PostgreSQL integration checks
        env:
          PYTHONPATH: backend/asset_forge:.
        run: python -m pytest -q backend/tests/test_owner_binding_postgres_integration.py

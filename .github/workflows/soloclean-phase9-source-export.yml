name: SoloClean Phase 9 Source Export

on:
  push:
    branches:
      - feature/soloclean-phase9-project-intelligence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Phase 9 source patch
        shell: bash
        run: |
          set -euo pipefail
          cat artifacts/soloclean/phase9/part*.bin > /tmp/soloclean-phase9-patch.tar.xz
          echo "f20d90d5d518e1bb71ecf606e5336d96ff3b8f694fc4513672a6d0a33c85cf9c  /tmp/soloclean-phase9-patch.tar.xz" | sha256sum -c -
          mkdir -p export
          tar -xJf /tmp/soloclean-phase9-patch.tar.xz -C export
          mkdir -p export/app/src/main/java/com/soloforge/soloclean/project
          cp artifacts/soloclean/phase9fix/ProjectFingerprintEngine.kt export/app/src/main/java/com/soloforge/soloclean/project/ProjectFingerprintEngine.kt
          find export -type f -print | sort

      - name: Upload source export
        uses: actions/upload-artifact@v4
        with:
          name: soloclean-phase9-source-export
          if-no-files-found: error
          retention-days: 1
          path: export/

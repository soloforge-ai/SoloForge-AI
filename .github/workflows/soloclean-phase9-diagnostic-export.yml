name: SoloClean Phase 9 Diagnostic Export

on:
  push:
    branches:
      - feature/soloclean-phase9-project-intelligence
      - feature/soloclean-phase10-project-cleanup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract current and previous Phase 9 patches
        shell: bash
        run: |
          set -euo pipefail

          cat artifacts/soloclean/phase9/part*.bin > /tmp/current-phase9.tar.xz
          echo "336d61c49d1e46caf1d2f6feaeb3ebdb2384bec9122d1980d9c7e9a2e0415b65  /tmp/current-phase9.tar.xz" | sha256sum -c -
          mkdir -p export-current
          tar -xJf /tmp/current-phase9.tar.xz -C export-current

          mkdir -p /tmp/oldparts export-previous
          for n in 00 01 02 03 04; do
            f="artifacts/soloclean/phase9/part${n}.bin"
            git show 40a032db4c8e1fe3f2e02b18aca9d039a568143d:"$f" > "/tmp/oldparts/part${n}.bin"
          done
          cat /tmp/oldparts/part*.bin > /tmp/previous-phase9.tar.xz
          echo "f20d90d5d518e1bb71ecf606e5336d96ff3b8f694fc4513672a6d0a33c85cf9c  /tmp/previous-phase9.tar.xz" | sha256sum -c -
          tar -xJf /tmp/previous-phase9.tar.xz -C export-previous

          for root in export-current export-previous; do
            test -s "$root/app/src/main/java/com/soloforge/soloclean/ui/project/ProjectScreen.kt"
            test -s "$root/app/src/main/java/com/soloforge/soloclean/project/AndroidProjectRepository.kt"
          done

          echo '--- CURRENT ProjectScreen markers ---'
          grep -n 'Bulk project review\|SELECT SUGGESTED\|Checkbox\|CONFIRM SELECTED\|REJECT SELECTED' export-current/app/src/main/java/com/soloforge/soloclean/ui/project/ProjectScreen.kt || true
          echo '--- CURRENT repository markers ---'
          grep -n 'saveDecisions\|KEY_DECISIONS\|ProjectCandidateStatus.valueOf' export-current/app/src/main/java/com/soloforge/soloclean/project/AndroidProjectRepository.kt || true
          echo '--- PREVIOUS repository markers ---'
          grep -n 'saveDecision\|KEY_DECISIONS\|ProjectCandidateStatus.valueOf' export-previous/app/src/main/java/com/soloforge/soloclean/project/AndroidProjectRepository.kt || true

      - name: Upload diagnostic source
        uses: actions/upload-artifact@v4
        with:
          name: soloclean-phase9-diagnostic-source
          if-no-files-found: error
          retention-days: 1
          path: |
            export-current/app/src/main/java/com/soloforge/soloclean/
            export-current/app/src/test/java/com/soloforge/soloclean/
            export-current/app/build.gradle.kts
            export-previous/app/src/main/java/com/soloforge/soloclean/ui/project/ProjectScreen.kt
            export-previous/app/src/main/java/com/soloforge/soloclean/project/AndroidProjectRepository.kt

name: Flutter Asset Forge Test

on:
  push:
    branches:
      - feature/asset-forge-mvp
  pull_request:
    branches:
      - main
      - feature/asset-forge-mvp
  workflow_dispatch:

jobs:
  test-flutter:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Flutter Web
        run: flutter build web --release

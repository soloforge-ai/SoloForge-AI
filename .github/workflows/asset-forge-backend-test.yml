name: Asset Forge Backend Test

on:
  push:
    branches:
      - feature/asset-forge-mvp
    paths:
      - 'backend/asset_forge/**'
      - 'backend/pollinations_oauth.py'
      - 'backend/pollinations_oauth_router.py'
      - 'backend/idea_flow_webhook.py'
      - 'supabase/migrations/**'
      - 'backend/tests/**'
      - 'tools/scanner/**'
      - '.github/workflows/asset-forge-backend-test.yml'
  pull_request:
    branches:
      - main
      - fix/ruj-batch-a-auth-gates
      - feature/asset-forge-mvp
    paths:
      - 'backend/asset_forge/**'
      - 'backend/pollinations_oauth.py'
      - 'backend/pollinations_oauth_router.py'
      - 'backend/idea_flow_webhook.py'
      - 'supabase/migrations/**'
      - 'backend/tests/**'
      - 'tools/scanner/**'
      - '.github/workflows/asset-forge-backend-test.yml'
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: queue_cancel_test
          POSTGRES_USER: queue_test
          POSTGRES_PASSWORD: fixture-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queue_test -d queue_cancel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QUEUE_RESET_TEST_DATABASE_URL: postgresql://queue_test:fixture-only-password@127.0.0.1:5432/queue_cancel_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/asset_forge/requirements.txt pytest httpx 'psycopg[binary]'

      - name: Compile backend Python
        run: |
          python -m compileall -q backend/asset_forge/main.py
          python -m compileall -q backend/asset_forge/runtime.py
          python -m compileall -q backend/asset_forge/worker.py
          python -m compileall -q backend/asset_forge/backend
          python -m compileall -q backend/pollinations_oauth.py
          python -m compileall -q backend/pollinations_oauth_router.py
          python -m compileall -q backend/idea_flow_webhook.py
          python -m compileall -q backend/tests
          python -m compileall -q tools/scanner

      - name: Run complete backend and scanner test suites
        run: |
          PYTHONPATH=backend/asset_forge:. python -m pytest -q \
            backend/asset_forge/tests \
            backend/tests \
            tools/scanner/tests \
            backend/asset_forge/test_character_memory_bridge.py

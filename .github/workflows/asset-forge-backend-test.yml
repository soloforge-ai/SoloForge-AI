name: Asset Forge Backend Test

on:
  push:
    branches:
      - feature/asset-forge-mvp
    paths:
      - 'backend/asset_forge/**'
      - 'backend/pollinations_oauth.py'
      - 'backend/pollinations_oauth_router.py'
      - 'backend/idea_flow_webhook.py'
      - 'supabase/migrations/**'
      - 'backend/tests/**'
      - 'tools/scanner/**'
      - '.github/workflows/asset-forge-backend-test.yml'
  pull_request:
    branches:
      - main
      - feature/asset-forge-mvp
    paths:
      - 'backend/asset_forge/**'
      - 'backend/pollinations_oauth.py'
      - 'backend/pollinations_oauth_router.py'
      - 'backend/idea_flow_webhook.py'
      - 'supabase/migrations/**'
      - 'backend/tests/**'
      - 'tools/scanner/**'
      - '.github/workflows/asset-forge-backend-test.yml'
  workflow_dispatch:

jobs:
  backend-test:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/asset_forge/requirements.txt pytest httpx

      - name: Install offline render test dependencies
        timeout-minutes: 6
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Set up Node for Owner V2 SQL tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Owner V2 SQL test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/owner-v2-sql-test" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.3.14
          pglite_module="$(realpath "$RUNNER_TEMP/owner-v2-sql-test/node_modules/@electric-sql/pglite/dist/index.js")"
          test -f "$pglite_module"
          echo "OWNER_V2_TEST_PGLITE=$pglite_module" >> "$GITHUB_ENV"

      - name: Compile backend Python
        run: |
          python -m compileall -q backend/asset_forge/main.py
          python -m compileall -q backend/asset_forge/runtime.py
          python -m compileall -q backend/asset_forge/worker.py
          python -m compileall -q backend/asset_forge/backend
          python -m compileall -q backend/pollinations_oauth.py
          python -m compileall -q backend/pollinations_oauth_router.py
          python -m compileall -q backend/idea_flow_webhook.py
          python -m compileall -q backend/tests
          python -m compileall -q tools/scanner

      - name: Run complete backend and scanner test suites
        run: |
          PYTHONPATH=backend/asset_forge:. python -m pytest -q -rA \
            backend/asset_forge/tests \
            backend/tests \
            tools/scanner/tests \
            backend/asset_forge/test_character_memory_bridge.py

  # Explicit manual invocation only. Never run automatically on PR/push.
  s1-offline-verification:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      SOLOFORGE_RUN_EMBEDDED_WORKERS: 'false'
      SOLOFORGE_RUN_DEDICATED_WORKERS: 'false'
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build disposable Python 3.12 test image (network permitted for dependency installation only)
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --tag soloforge-s1-offline:${GITHUB_SHA} -f - . <<'DOCKERFILE'
          FROM python:3.12-slim
          WORKDIR /workspace
          ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
          COPY backend/asset_forge/requirements.txt /tmp/asset-forge-requirements.txt
          RUN python -m pip install --no-cache-dir -r /tmp/asset-forge-requirements.txt pytest httpx
          COPY . /workspace
          DOCKERFILE

      - name: Fail-closed isolated S1 verification (no network, no secrets)
        shell: bash
        run: |
          set -euo pipefail
          isolation=(--rm --network none --cap-drop ALL --security-opt no-new-privileges
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m
            --env SOLOFORGE_RUN_EMBEDDED_WORKERS=false
            --env SOLOFORGE_RUN_DEDICATED_WORKERS=false
            --env HOME=/tmp --env PYTHONPATH=backend/asset_forge:. --workdir /workspace)
          image="soloforge-s1-offline:${GITHUB_SHA}"
          # Verify isolation inside the exact container configuration used by pytest.
          docker run "${isolation[@]}" "$image" python -c '
          import socket
          from pathlib import Path
          ipv4 = Path("/proc/net/route").read_text().splitlines()[1:]
          ipv6 = Path("/proc/net/ipv6_route").read_text().splitlines()
          assert all(line.split()[0] == "lo" for line in ipv4), ipv4
          assert all(line.split()[-1] == "lo" for line in ipv6), ipv6
          for family, address in ((socket.AF_INET, ("1.1.1.1", 443)),
                                  (socket.AF_INET6, ("2606:4700:4700::1111", 443))):
              try:
                  with socket.socket(family, socket.SOCK_STREAM) as sock:
                      sock.settimeout(2)
                      sock.connect(address)
              except OSError:
                  continue
              raise SystemExit("FAIL: outbound network reachable")
          print("PASS: container network isolation preflight")
          '
          docker run "${isolation[@]}" "$image" \
            python -m pytest -q backend/asset_forge/tests/test_execution_policy.py

  cloudflare-native:
    name: Cloudflare native PostgreSQL 17 and AES-GCM
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 214 && github.head_ref == 'feature/cloudflare-native-verification' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Official docker-library/repo-info: repos/postgres/remote/17-bookworm.md
        image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_DB: cloudflare_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        volumes:
          - /tmp/soloforge-cloudflare-native-socket:/var/run/postgresql
        # No ports published. Remove the setup network before application tests.
        options: >-
          --health-cmd "pg_isready -U postgres -d cloudflare_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout exact dispatched revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up application Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned application and test dependencies
        env:
          PIP_INDEX_URL: https://pypi.org/simple
          PIP_EXTRA_INDEX_URL: ''
          PIP_CONFIG_FILE: /dev/null
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --report "$RUNNER_TEMP/cloudflare-pip-report.json" \
            -r backend/asset_forge/requirements.txt pytest==8.4.2 httpx==0.28.1 'psycopg[binary]==3.2.10'
          python -m pip check
          python -c 'import sys, cryptography; from cryptography.hazmat.primitives.ciphers.aead import AESGCM; assert sys.version_info[:2] == (3,12); assert cryptography.__version__ == "46.0.3"; print("Python 3.12 / cryptography 46.0.3 AESGCM import PASS")'
      - name: Disconnect disposable PostgreSQL from all networks
        env:
          CF_NATIVE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          [[ "$CF_NATIVE_CONTAINER" =~ ^[0-9a-f]{12,64}$ ]]
          image_id=$(docker inspect --format '{{.Image}}' "$CF_NATIVE_CONTAINER")
          digests=$(docker image inspect --format '{{json .RepoDigests}}' "$image_id")
          EXPECTED_DIGEST=sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5 IMAGE_DIGESTS="$digests" python -c 'import json,os; assert any(x.endswith("@"+os.environ["EXPECTED_DIGEST"]) for x in json.loads(os.environ["IMAGE_DIGESTS"]))'
          echo "$digests"
          docker exec "$CF_NATIVE_CONTAINER" postgres --version
          for net in $(docker inspect --format '{{range $name, $value := .NetworkSettings.Networks}}{{$name}} {{end}}' "$CF_NATIVE_CONTAINER"); do
            docker network disconnect "$net" "$CF_NATIVE_CONTAINER"
          done
          test "$(docker inspect --format '{{json .NetworkSettings.Networks}}' "$CF_NATIVE_CONTAINER")" = '{}'
          bindings=$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$CF_NATIVE_CONTAINER")
          test "$bindings" = '{}' || test "$bindings" = 'null'
      - name: Native PostgreSQL contracts and actual application AES-GCM, no provider network
        env:
          CF_NATIVE_CONTAINER: ${{ job.services.postgres.id }}
          PYTHONPATH: backend/asset_forge:backend/asset_forge/tests:.
          SOLOFORGE_RUN_EMBEDDED_WORKERS: 'false'
          SOLOFORGE_RUN_DEDICATED_WORKERS: 'false'
        run: python backend/asset_forge/tests/run_cloudflare_native.py

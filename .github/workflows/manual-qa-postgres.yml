name: Manual QA PostgreSQL Integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/202610180001_manual_owner_qa_foundation.sql'
      - 'tests/test_manual_qa_postgres.py'
      - '.github/workflows/manual-qa-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manual-qa-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: manual_qa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d manual_qa_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only_password
      PGDATABASE: manual_qa_test
      TEST_DATABASE_URL: postgresql://postgres:test_only_password@localhost:5432/manual_qa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'psycopg[binary]>=3.2,<4' 'pytest>=8,<10'
      - name: Bootstrap disposable Supabase-compatible roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          GRANT anon, authenticated, service_role TO postgres;
          CREATE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE
          AS $$
            SELECT nullif(current_setting('request.jwt.claim.role',true),'')
          $$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.role() TO anon, authenticated, service_role;
          GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
          SQL
      - name: Apply PR migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610180001_manual_owner_qa_foundation.sql
      - name: Verify RPC, RLS, idempotency, and concurrent claims
        run: python -m pytest tests/test_manual_qa_postgres.py -q --tb=short

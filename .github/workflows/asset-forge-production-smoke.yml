name: Asset Forge Production Smoke

on:
  push:
    branches:
      - main
    paths:
      - 'backend/asset_forge/**'
      - 'backend/pollinations_oauth.py'
      - 'backend/pollinations_oauth_router.py'
      - 'render.yaml'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASSET_FORGE_BASE_URL: https://soloforge-asset-forge.onrender.com
    steps:
      # Read-only GET checks only; production backend auto-deploy is disabled.
      - name: Wait for production health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
              --connect-timeout 15 --max-time 20 \
              "$ASSET_FORGE_BASE_URL/health" || true)
            echo "health attempt $attempt => HTTP $code"
            cat /tmp/health.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              if python -c "import json; from pathlib import Path; payload=json.loads(Path('/tmp/health.json').read_text()); assert payload.get('status') == 'ok', payload; assert payload.get('service') == 'asset-forge', payload; print('health contract ok')"; then
                exit 0
              fi
            fi
            sleep 15
          done
          echo 'Production health did not become ready with the expected contract in time.'
          exit 1

      - name: Wait for OpenAPI production contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..8}; do
            code=$(curl -sS -o /tmp/openapi.json -w '%{http_code}' \
              --connect-timeout 15 --max-time 20 \
              "$ASSET_FORGE_BASE_URL/openapi.json" || true)
            echo "openapi attempt $attempt => HTTP $code"
            if [ "$code" = "200" ]; then
              if python -c "import json; from pathlib import Path; payload=json.loads(Path('/tmp/openapi.json').read_text()); paths=payload.get('paths', {}); assert '/health' in paths, paths.keys(); assert '/v1/asset-forge/generate' in paths, paths.keys(); assert 'post' in paths['/v1/asset-forge/generate']; print('openapi contract ok')"; then
                exit 0
              fi
            fi
            cat /tmp/openapi.json 2>/dev/null | head -c 1200 || true
            echo
            sleep 10
          done
          echo 'Production OpenAPI contract did not become ready in time.'
          exit 1


name: SoloClean Phase 10.4 Verified Folder Delete CI

on:
  push:
    branches:
      - feature/soloclean-phase10-project-cleanup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode Phase 10.3 safety bundle
        shell: bash
        run: |
          set -euo pipefail
          cat artifacts/soloclean/phase10p3/part*.b64 | base64 -d > /tmp/soloclean-phase10p3-bundle.tar.gz
          echo "d8efb846fa31ea0ebc71174443a4e82d9bb29dcc54e376b9e04d87ae224c291c  /tmp/soloclean-phase10p3-bundle.tar.gz" | sha256sum -c -
          rm -rf /tmp/phase10p3 && mkdir -p /tmp/phase10p3
          tar -xzf /tmp/soloclean-phase10p3-bundle.tar.gz -C /tmp/phase10p3
          chmod +x /tmp/phase10p3/build_phase10p3.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-37.0" --channel=3

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct and verify Phase 10.3 baseline
        shell: bash
        run: /tmp/phase10p3/build_phase10p3.sh

      - name: Apply verified folder delete safety patch
        shell: bash
        run: |
          set -euo pipefail
          python3 artifacts/soloclean/phase10fix/apply_verified_folder_delete.py
          grep -q 'verifyFolderDeleted(itemUri)' soloclean/app/src/main/java/com/soloforge/soloclean/cleanup/AndroidSafCleanupEngine.kt
          grep -q 'DocumentPresence.PRESENT' soloclean/app/src/main/java/com/soloforge/soloclean/cleanup/AndroidSafCleanupEngine.kt
          grep -q 'const val FOLDER_DELETE_VERIFY_RETRIES = 3' soloclean/app/src/main/java/com/soloforge/soloclean/cleanup/AndroidSafCleanupEngine.kt
          grep -q 'verifyFolderDeleted' soloclean/app/src/main/java/com/soloforge/soloclean/cleanup/AndroidSafCleanupEngine.kt
          grep -q 'EmptyFolderState.TRULY_EMPTY' soloclean/app/src/main/java/com/soloforge/soloclean/scanner/AndroidReadOnlyScanEngine.kt
          grep -q 'EmptyFolderState.CONTAINS_ONLY_EMPTY_SUBFOLDERS' soloclean/app/src/main/java/com/soloforge/soloclean/scanner/AndroidReadOnlyScanEngine.kt
          grep -q 'TRULY EMPTY FOLDER' soloclean/app/src/main/java/com/soloforge/soloclean/ui/review/ReviewScreen.kt
          grep -q 'EMPTY TREE' soloclean/app/src/main/java/com/soloforge/soloclean/ui/review/ReviewScreen.kt
          grep -q 'versionName = "0.10.4-phase10p4"' soloclean/app/build.gradle.kts

      - name: Unit tests
        working-directory: soloclean
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Android lint
        working-directory: soloclean
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Assemble debug APK
        working-directory: soloclean
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify Phase 10.4 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="soloclean/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -q "package: name='com.soloforge.soloclean'"
          printf '%s\n' "$BADGING" | grep -q "versionName='0.10.4-phase10p4'"

          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK" | tee soloclean/app/build/outputs/apk/debug/signing.txt
          SIGNER_SHA=$(grep -m1 'certificate SHA-256 digest:' soloclean/app/build/outputs/apk/debug/signing.txt | sed 's/.*digest: //' | tr 'A-F' 'a-f')
          test "$SIGNER_SHA" = "8b88619724c1ae03344dd350868dd15babf1d1ab7f0bafa43c0c479948f1d360"

          PERMISSIONS="$($ANDROID_HOME/build-tools/36.0.0/aapt dump permissions "$APK")"
          printf '%s\n' "$PERMISSIONS" | tee soloclean/app/build/outputs/apk/debug/permissions.txt
          ! printf '%s\n' "$PERMISSIONS" | grep -q 'android.permission.INTERNET'
          ! printf '%s\n' "$PERMISSIONS" | grep -q 'android.permission.MANAGE_EXTERNAL_STORAGE'

          rm -rf /tmp/apk-dex && mkdir -p /tmp/apk-dex
          unzip -q "$APK" 'classes*.dex' -d /tmp/apk-dex
          strings /tmp/apk-dex/classes*.dex > /tmp/apk-strings.txt
          grep -q 'VERIFIED FOLDER DELETE' /tmp/apk-strings.txt
          grep -q 'TRULY EMPTY FOLDER' /tmp/apk-strings.txt
          grep -q 'EMPTY TREE' /tmp/apk-strings.txt

          sha256sum "$APK" | tee soloclean/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload Phase 10.4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: soloclean-phase10p4-verified-folder-delete-debug
          if-no-files-found: error
          retention-days: 7
          path: |
            soloclean/app/build/outputs/apk/debug/app-debug.apk
            soloclean/app/build/outputs/apk/debug/app-debug.apk.sha256
            soloclean/app/build/outputs/apk/debug/signing.txt
            soloclean/app/build/outputs/apk/debug/permissions.txt
            soloclean/app/build/reports/tests/testDebugUnitTest/
            soloclean/app/build/reports/lint-results-debug.html

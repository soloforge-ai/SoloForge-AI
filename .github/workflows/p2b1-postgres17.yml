name: P2-B1 PostgreSQL 17 disposable verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-postgres
          POSTGRES_DB: p2b1_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p2b1_disposable"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PGPASSWORD: test-only-postgres
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: p2b1_disposable
      P2B1_TEST_DSN: postgresql://postgres:test-only-postgres@localhost:5432/p2b1_disposable
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest 'psycopg[binary]'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Bootstrap isolated synthetic prerequisites
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/generation_phase1_baseline.sql
      - name: Apply recovered Phase 1 migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261009232734_generation_db_foundation_phase1.sql
      - name: Verify native PostgreSQL Phase 1 security
        run: python -m pytest -q tests/p2b1/test_phase1_postgres.py
      - name: Fail closed until compatible service-only RPCs and concurrency tests exist
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/202610140005_generation_service_rpcs_phase1.sql || {
            echo "::error::Compatible Phase 1 RPC migration missing; concurrency/settlement NOT VERIFIED."
            exit 1
          }
          echo "::error::RPC migration and concurrency suite must be wired before this job can pass."
          exit 1

name: P2-B1 PostgreSQL 17 disposable verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-postgres
          POSTGRES_DB: p2b1_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p2b1_disposable"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PGPASSWORD: test-only-postgres
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: p2b1_disposable
      P2B1_TEST_DSN: postgresql://postgres:test-only-postgres@localhost:5432/p2b1_disposable
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest 'psycopg[binary]'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Fail closed until Phase 1 baseline and RPC reconciliation are committed
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/tests/generation_phase1_baseline.sql || {
            echo "::error::Missing original Phase 1 synthetic prerequisite fixture; cannot validate PostgreSQL migration."
            exit 1
          }
          test -f supabase/migrations/20261009232734_generation_db_foundation_phase1.sql || {
            echo "::error::Original Phase 1 migration absent; PR #177 incompatible clean-rebuild SQL must not be tested as authoritative."
            exit 1
          }
          echo "::error::RPC/state-machine migration reconciliation must be verified before running integration tests."
          exit 1

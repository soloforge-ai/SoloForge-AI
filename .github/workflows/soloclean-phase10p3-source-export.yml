name: SoloClean Phase 10.3 Source Export

on:
  push:
    branches:
      - feature/soloclean-phase10-project-cleanup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode Phase 10.3 safety bundle
        shell: bash
        run: |
          set -euo pipefail
          cat artifacts/soloclean/phase10p3/part*.b64 | base64 -d > /tmp/soloclean-phase10p3-bundle.tar.gz
          echo "d8efb846fa31ea0ebc71174443a4e82d9bb29dcc54e376b9e04d87ae224c291c  /tmp/soloclean-phase10p3-bundle.tar.gz" | sha256sum -c -
          rm -rf /tmp/phase10p3 && mkdir -p /tmp/phase10p3
          tar -xzf /tmp/soloclean-phase10p3-bundle.tar.gz -C /tmp/phase10p3
          chmod +x /tmp/phase10p3/build_phase10p3.sh
      - name: Reconstruct source without building
        shell: bash
        run: |
          set -euo pipefail
          export SOLO_CLEAN_EXPORT_ONLY=1
          /tmp/phase10p3/build_phase10p3.sh || true
          test -d soloclean/app/src/main/java
      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: soloclean-phase10p3-source
          retention-days: 1
          path: |
            soloclean/app/src/main/java/
            soloclean/app/src/test/java/
            soloclean/app/build.gradle.kts

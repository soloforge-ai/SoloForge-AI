name: Memory Foundation Tests

on:
  push:
    branches:
      - feature/memory-character-dna
    paths:
      - 'backend/memory.py'
      - 'backend/character_memory.py'
      - 'backend/seed_character_memory.py'
      - 'backend/test_memory.py'
      - 'backend/test_memory_e2e.py'
      - 'backend/test_pollinations_memory.py'
      - 'backend/test_character_memory.py'
      - '.github/workflows/memory-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/memory.py'
      - 'backend/character_memory.py'
      - 'backend/seed_character_memory.py'
      - 'backend/test_memory.py'
      - 'backend/test_memory_e2e.py'
      - 'backend/test_pollinations_memory.py'
      - 'backend/test_character_memory.py'
      - '.github/workflows/memory-tests.yml'
  workflow_dispatch:

jobs:
  test-memory:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run Memory Foundation tests
        run: python -m unittest -v test_memory.py test_memory_e2e.py test_pollinations_memory.py test_character_memory.py

name: Income Engine Tests

on:
  pull_request:
    branches:
      - main
      - docs/income-engine-p3-scoring
    paths:
      - 'backend/income_engine.py'
      - 'backend/income_engine_choice.py'
      - 'backend/test_income_engine.py'
      - 'backend/test_income_engine_choice.py'
      - '.github/workflows/income-engine-tests.yml'
  workflow_dispatch:

jobs:
  income-engine-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Income Engine tests
        run: |
          python -m unittest -v \
            test_income_engine.py \
            test_income_engine_choice.py
